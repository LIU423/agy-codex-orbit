[project]
name = "agy-codex-orbit"
version = "0.1.0"
description = "Google Antigravity 2.0 native MCP App plugin for OpenAI Codex delegation and zero-token live monitoring"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.25.0",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
